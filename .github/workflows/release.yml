# Fork safety: upstream publication and all signing-secret forwarding are disabled.
# A separately reviewed Sh*ftAnything release workflow is required before publication.
name: Release disabled - Sh*ftAnything
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain release block
        run: |
          echo 'Publication disabled. Use the local Sh*ftAnything test DMG; no signing credentials are accepted.' >&2
          exit 1
