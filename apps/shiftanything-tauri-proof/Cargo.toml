[package]
name = "shiftanything-tauri-proof"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
windows-lifecycle = []

[dependencies]
artcraft-launcher-core.workspace = true
artcraft-launcher-native.workspace = true
serde.workspace = true
serde_json.workspace = true
sys-locale = "0.3"
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "custom-protocol"] }

# Every Windows build compiles these; the updater code runs only with windows-lifecycle (build.rs sets cfg(signed_updates)).
[target.'cfg(any(target_os = "macos", target_os = "linux", windows))'.dependencies]
base64 = "0.22"
minisign-verify = "0.2"
tauri-plugin-updater = { version = "=2.12.0", default-features = false, features = ["rustls-tls"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
rustix = { version = "=1.1.6", features = ["fs"] }

[build-dependencies]
serde_json.workspace = true
tauri-build = { version = "=2.7.4", features = [] }

[dev-dependencies]
tempfile = "3"
